name: Linux guest build
on: [push, pull_request, workflow_dispatch]
jobs:
  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Current KWin's GPU-less software renderer uses udmabuf. This device is
      # only for the isolated compositor test, not the guest capture transport.
      - name: Prepare software compositor device
        run: |
          if ! sudo modprobe udmabuf; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe udmabuf
          fi
          test -c /dev/udmabuf
      - name: Arch build, transport and real KWin capture
        run: |
          docker run --rm --device /dev/udmabuf \
            -v "$GITHUB_WORKSPACE:/project" -w /project archlinux:base-devel bash -euc '
              chmod 666 /dev/udmabuf
              pacman -Syu --noconfirm git cmake ninja pkgconf pipewire glib2 dbus desktop-file-utils systemd wayland kwin mesa weston wireplumber
              bash build.sh
              bash tests/pipewire-lgmp.sh
              bash tests/kwin-native.sh
            '
  debian:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates build-essential cmake ninja-build pkg-config pipewire-bin libpipewire-0.3-dev libglib2.0-dev libglib2.0-bin dbus-daemon desktop-file-utils systemd libwayland-dev libwayland-bin
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: bash tests/pipewire-lgmp.sh
  ivshmem-qemu:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libglib2.0-dev libglib2.0-bin dbus-daemon desktop-file-utils systemd libwayland-dev libwayland-bin qemu-system-x86 busybox-static cpio gzip linux-image-amd64
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: bash tests/qemu-ivshmem.sh
