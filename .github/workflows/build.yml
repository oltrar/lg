name: Linux guest build
on: [push, pull_request, workflow_dispatch]
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git cmake ninja pkgconf pipewire glib2 dbus desktop-file-utils systemd
      - uses: actions/checkout@v4
      - run: bash build.sh
  debian:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libglib2.0-dev libglib2.0-bin dbus-daemon desktop-file-utils systemd
      - uses: actions/checkout@v4
      - run: bash build.sh
  ivshmem-qemu:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libglib2.0-dev libglib2.0-bin dbus-daemon desktop-file-utils systemd qemu-system-x86 busybox-static cpio gzip linux-image-amd64
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: bash tests/qemu-ivshmem.sh
