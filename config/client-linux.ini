# Pass with: looking-glass-client -C /absolute/path/client-linux.ini
# Edit shmFile and SPICE port to match ONLY the Linux VM.
[app]
shmFile=/dev/shm/looking-glass

[spice]
enable=yes
host=127.0.0.1
port=5901
input=yes
audio=yes
clipboard=no
captureOnStart=yes
alwaysShowCursor=no
showCursorDot=no

[input]
rawMouse=yes

[audio]
micDefault=allow
micShowIndicator=yes
# Keep guest volume separate from host levels.
syncVolume=no

# Requires a B7 client built with PipeWire. Leave recDevice unset to use the
# host's default source, or set it to the desired PipeWire node.name.
# [pipewire]
# recDevice=alsa_input.YOUR_MICROPHONE_NODE

[win]
title=Linux VM — Looking Glass B7
