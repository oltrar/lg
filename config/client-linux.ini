# Pass with: looking-glass-client -C /absolute/path/client-linux.ini
# Edit shmFile and SPICE port to match ONLY the Linux VM.
[app]
shmFile=/dev/shm/looking-glass-linux

[spice]
enable=yes
host=127.0.0.1
port=5901
input=yes
audio=yes
clipboard=no
captureOnStart=yes
alwaysShowCursor=no
showCursorDot=no

[input]
rawMouse=yes

[win]
title=Linux VM — Looking Glass B7
